name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: option-sniper-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.EC2_HOST }}
      DEPLOY_USER: ${{ secrets.EC2_USER }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure trusted SSH access
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          key_path="$RUNNER_TEMP/option-sniper-ssh-key"
          known_hosts="$RUNNER_TEMP/option-sniper-known-hosts"
          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "$EC2_SSH_KEY" > "$key_path"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$known_hosts"
          chmod 0600 "$key_path" "$known_hosts"
          ssh-keygen -y -f "$key_path" >/dev/null

      - name: Package tested revision
        run: |
          revision="${DEPLOY_SHA:0:8}"
          archive="option-sniper-${revision}.tar.gz"
          git archive --format=tar.gz --output="$RUNNER_TEMP/$archive" "$DEPLOY_SHA"
          checksum=$(sha256sum "$RUNNER_TEMP/$archive" | awk '{print $1}')
          printf 'REVISION=%s\nARCHIVE=%s\nARCHIVE_SHA256=%s\n' \
            "$revision" "$archive" "$checksum" >> "$GITHUB_ENV"

      - name: Upload and deploy
        run: |
          key_path="$RUNNER_TEMP/option-sniper-ssh-key"
          known_hosts="$RUNNER_TEMP/option-sniper-known-hosts"
          ssh_options=(
            -i "$key_path"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$known_hosts"
            -o ConnectTimeout=15
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
          )
          scp "${ssh_options[@]}" \
            "$RUNNER_TEMP/$ARCHIVE" \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/$ARCHIVE"
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- '$REVISION' '$ARCHIVE_SHA256'" \
            < deploy/ec2-deploy.sh
