name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[test]'
      - name: Compile Python
        run: python -m compileall -q scripts tests
      - name: Run Python tests with branch coverage
        run: make coverage
      - name: Run frontend tests
        run: make test-js
