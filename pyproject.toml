[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sigma-tape"
version = "0.1.0"
description = "Live Nasdaq option-implied Z-score dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiohttp==3.14.3",
  "databento==0.85.0",
  "exchange-calendars>=4.11,<5",
  "numpy>=2,<3",
  "pandas>=2.2,<4",
]

[tool.setuptools]
packages = ["scripts"]
