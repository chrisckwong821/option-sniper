[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "option-sniper"
version = "0.1.0"
description = "Live option-implied sigma-adjusted mover dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiohttp==3.14.3",
  "boto3[crt]>=1.42,<2",
  "databento==0.85.0",
  "exchange-calendars>=4.11,<5",
  "numpy>=2,<3",
  "pandas>=2.2,<4",
]

[project.optional-dependencies]
test = [
  "coverage[toml]>=7.6,<9",
]

[tool.setuptools]
packages = ["scripts"]

[tool.coverage.run]
branch = true
source = ["scripts"]

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_covered = true
exclude_also = [
  "if __name__ == .__main__.:",
]
