name: sigma-tape

services:
  backend:
    image: sigma-tape:${SIGMA_TAPE_VERSION:-local}
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: sigma-tape
    restart: unless-stopped
    init: true
    env_file:
      - /etc/sigma-tape/sigma-tape.env
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - /var/lib/sigma-tape:/app/.cache/sigma-tape
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1536m
    cpus: 1.5
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  alerter:
    image: sigma-tape:${SIGMA_TAPE_VERSION:-local}
    container_name: sigma-tape-alerter
    restart: unless-stopped
    init: true
    entrypoint: ["python", "-m", "scripts.discord_zscore_alert"]
    env_file:
      - /etc/sigma-tape/sigma-tape.env
    environment:
      SIGMA_BACKEND_URL: http://backend:8765
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - /var/lib/sigma-tape:/app/.cache/sigma-tape
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25
    stop_grace_period: 20s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - from pathlib import Path; assert Path('/app/.cache/sigma-tape/discord-alerts.sqlite3').exists()
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
